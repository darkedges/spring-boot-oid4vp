# Activated via SPRING_PROFILES_ACTIVE=cloudflare — see docker-compose.cloudflare.yml and the "Hosting
# behind Cloudflare" section of README.md. Both apps are assumed publicly reachable on their own domain,
# so every URL below is the public one (including the ones the two apps use to call each other) rather
# than a docker-compose-internal hostname — this pair is meant to work as if operated by two independent
# parties, not just two containers on one private network.
demo:
  wallet-base-url: https://wallet.zkp.au
  wallet-base-url-for-browser: https://wallet.zkp.au
  same-device-result-base-uri: https://verify.irving.au/oid4vp/result
  verifier-base-url-for-wallet: https://verify.irving.au
  request-uri-base: https://verify.irving.au/oid4vp/request

oid4vp:
  verifier:
    relying-party:
      demo:
        client-id: "x509_san_dns:verify.irving.au"
        response-uri: "https://verify.irving.au/login/oid4vp/direct-post/demo"
      # A second registration, separate from "demo": some conformance test plans require
      # response_mode=direct_post.jwt (encrypted response), which our own demo Wallet can't produce —
      # nothing in oid4vp-wallet-core can encrypt a response yet. Keeping this isolated means the local
      # browser demo (registration "demo", plain direct_post) is unaffected either way.
      conformance:
        client-id: "x509_san_dns:verify.irving.au"
        response-uri: "https://verify.irving.au/login/oid4vp/direct-post/conformance"
        response-mode: "direct_post.jwt"
        dcql-query: >
          {"credentials":[{"id":"employee","format":"dc+sd-jwt",
          "meta":{"vct_values":["https://demo.oid4vp.example/employee_credential"]},
          "claims":[{"path":["given_name"]},{"path":["family_name"]}]}]}
        # Public half of DemoVerifierEncryptionKeyConfig's static key — keep in sync if regenerated.
        client-metadata: >
          {"jwks":{"keys":[{"kty":"EC","use":"enc","crv":"P-256","kid":"demo-verifier-encryption",
          "x":"xrGuOuYtOsauuXNHkXlsFo93P14Yfu1VNXmpZR9-9JI",
          "y":"b_Xpz-0tRjZfXuwuA-UClHGO2P9t03b0qPeV9yn-cY0","alg":"ECDH-ES"}]},
          "encrypted_response_enc_values_supported":["A128GCM"]}
        # Set to a real Wallet's (or a conformance test run's exported) authorization_endpoint to enable
        # GET /oid4vp/invoke/conformance — see README: "Invoking a Wallet". Unset by default; the
        # CONFORMANCE_WALLET_AUTHORIZATION_ENDPOINT env var in docker-compose.yml sets this.
        wallet-authorization-endpoint: ""
