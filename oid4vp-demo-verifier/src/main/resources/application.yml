server:
  port: 8090

demo:
  wallet-base-url: http://localhost:8081
  # The URL the Wallet itself must use to fetch our /oid4vp/authorize/demo endpoint — same as
  # demo.wallet-base-url's reasoning, mirrored the other direction. Bare-metal: same origin the browser
  # uses. Under docker (see application-docker.yml): the compose service name, since "localhost" inside
  # the Wallet's container is itself, not us.
  verifier-base-url-for-wallet: http://localhost:8090

oid4vp:
  verifier:
    relying-party:
      demo:
        client-id: "redirect_uri:http://localhost:8090/login/oid4vp/direct-post/demo"
        response-uri: "http://localhost:8090/login/oid4vp/direct-post/demo"
        dcql-query: >
          {"credentials":[{"id":"employee","format":"dc+sd-jwt",
          "meta":{"vct_values":["https://demo.oid4vp.example/employee_credential"]},
          "claims":[{"path":["given_name"]},{"path":["family_name"]}]}]}

logging:
  level:
    com.darkedges.oid4vp: INFO
